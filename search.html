<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - StreamPulse</title>
    <link rel="stylesheet" href="css/search.css">
</head>
<body>
    <!-- Top Header Navigation -->
    <header class="app-header">
        <div class="header-left">
            <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle Navigation Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a href="index.html" class="brand-logo" aria-label="StreamPulse Home">
                <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>
                </svg>
                <span class="brand-name">StreamPulse</span>
            </a>
        </div>

        <div class="header-center">
            <form id="search-form" class="search-box">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="Search videos..." autocomplete="off">
                </div>
                <button type="submit" class="search-btn" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>
        </div>

        <div class="header-right" id="header-auth-section">
            <div class="auth-loading-spinner" id="auth-spinner"></div>
        </div>
    </header>

    <!-- App Layout Container -->
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="app-sidebar">
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <a href="index.html" class="nav-item">
                        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span class="nav-text">Home</span>
                    </a>
                    <a href="create-channel.html" class="nav-item">
                        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span class="nav-text">Create Channel</span>
                    </a>
                    <a href="upload.html" class="nav-item">
                        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span class="nav-text">Upload Video</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Sidebar Mobile Overlay Backdrop -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Main Search Content Workspace -->
        <main class="search-main-content">
            <!-- Results Metadata Header -->
            <div id="results-count" class="results-count hidden"></div>

            <!-- Loading State (Skeleton Cards) -->
            <div id="skeleton-container" class="search-results-list">
                <div class="skeleton-search-card"><div class="skeleton-thumb"></div><div class="skeleton-details"><div class="skeleton-line title"></div><div class="skeleton-line short"></div><div class="skeleton-avatar-row"><div class="skeleton-avatar"></div><div class="skeleton-line text"></div></div><div class="skeleton-line desc"></div></div></div>
                <div class="skeleton-search-card"><div class="skeleton-thumb"></div><div class="skeleton-details"><div class="skeleton-line title"></div><div class="skeleton-line short"></div><div class="skeleton-avatar-row"><div class="skeleton-avatar"></div><div class="skeleton-line text"></div></div><div class="skeleton-line desc"></div></div></div>
                <div class="skeleton-search-card"><div class="skeleton-thumb"></div><div class="skeleton-details"><div class="skeleton-line title"></div><div class="skeleton-line short"></div><div class="skeleton-avatar-row"><div class="skeleton-avatar"></div><div class="skeleton-line text"></div></div><div class="skeleton-line desc"></div></div></div>
            </div>

            <!-- Authentication Required State (401 Error) -->
            <div id="auth-required-state" class="state-container hidden">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#3ea6ff" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h2>Sign in to search videos</h2>
                <p>The backend requires you to be logged in to access video search features.</p>
                <div class="state-actions">
                    <a href="login.html" class="btn btn-primary">Sign In</a>
                    <a href="register.html" class="btn btn-outline">Create Account</a>
                </div>
            </div>

            <!-- Empty Search Results State -->
            <div id="empty-state" class="state-container hidden">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
                <h2>No Results Found</h2>
                <p id="empty-message">Try different keywords or remove search filters.</p>
            </div>

            <!-- Server Error State -->
            <div id="error-state" class="state-container hidden">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ff4e4e" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h2>Search Failed</h2>
                <p id="error-message">Unable to connect to the backend server.</p>
                <button id="retry-btn" class="btn btn-primary">Retry</button>
            </div>

            <!-- Search Results Container -->
            <div id="results-list" class="search-results-list hidden"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/search.js"></script>
</body>
</html>
