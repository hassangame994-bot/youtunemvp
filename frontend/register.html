<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - StreamPulse</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <!-- Brand Logo Header -->
            <div class="auth-header">
                <a href="index.html" class="brand-logo" aria-label="StreamPulse Home">
                    <svg class="brand-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>
                    </svg>
                    <span class="brand-name">StreamPulse</span>
                </a>
                <h1 class="auth-title">Create your Account</h1>
                <p class="auth-subtitle">Join StreamPulse to share and watch videos</p>
            </div>

            <!-- Global Error Banner -->
            <div id="error-banner" class="alert alert-error hidden" role="alert" aria-live="polite">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-banner-text"></span>
            </div>

            <!-- Registration Form -->
            <form id="register-form" class="auth-form" novalidate>
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" autocomplete="name" required>
                    <span id="name-error" class="field-error-msg hidden"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
                    <span id="email-error" class="field-error-msg hidden"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" autocomplete="new-password" required>
                        <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Toggle password visibility">
                            <svg id="eye-icon-show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eye-icon-hide" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field-hint">Must be at least 8 characters long</span>
                    <span id="password-error" class="field-error-msg hidden"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
                    <span id="btn-text">Create Account</span>
                    <div id="btn-spinner" class="spinner hidden"></div>
                </button>
            </form>

            <!-- Card Footer -->
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
            </div>
        </div>
    </main>

    <script src="js/register.js"></script>
</body>
</html>
